name: Build

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - release/*
    types: [ opened, synchronize, reopened ]

jobs:
  # Prime a single LFS cache and expose the exact key for the matrix
  WarmLFS:
    runs-on: ubuntu-latest
    outputs:
      lfs_key: ${{ steps.expose-key.outputs.lfs_key }}
    steps:
      - name: Git Config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # Deterministic list of LFS object IDs, then compute a portable key:
      # - `git lfs ls-files -l` lists all tracked LFS objects with their SHA-256
      # - `awk '{print $1}'` extracts just the SHA field
      # - `sort` sorts in byte order (hex hashes sort the same everywhere)
      # This ensures the file content is identical regardless of OS or locale
      - name: Git Create LFS id list
        shell: bash
        run: git lfs ls-files -l | awk '{print $1}' | sort > .lfs-assets-id

      - name: Git Expose LFS cache key
        id: expose-key
        shell: bash
        env:
          LFS_KEY: lfs-${{ hashFiles('.lfs-assets-id') }}-v1
        run: echo "lfs_key=$LFS_KEY" >> "$GITHUB_OUTPUT"

      - name: Git Setup LFS Cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.expose-key.outputs.lfs_key }}

      - name: Git Pull LFS
        shell: bash
        run: git lfs pull

  Build:
    needs: WarmLFS
    strategy:
      matrix:
        options:
          - os: ubuntu-latest
            framework: net11.0
            sdk: 11.0.x
            sdk-preview: true
            runtime: -x64
            codecov: false
          - os: macos-26
            framework: net11.0
            sdk: 11.0.x
            sdk-preview: true
            runtime: -x64
            codecov: false
          - os: windows-latest
            framework: net11.0
            sdk: 11.0.x
            sdk-preview: true
            runtime: -x64
            codecov: false
          - os: ubuntu-22.04-arm
            framework: net11.0
            sdk: 11.0.x
            sdk-preview: true
            runtime: -x64
            codecov: false

          - os: ubuntu-latest
            framework: net10.0
            sdk: 10.0.x
            runtime: -x64
            codecov: false
          - os: macos-26
            framework: net10.0
            sdk: 10.0.x
            runtime: -x64
            codecov: false
          - os: windows-latest
            framework: net10.0
            sdk: 10.0.x
            runtime: -x64
            codecov: false
          - os: ubuntu-22.04-arm
            framework: net10.0
            sdk: 10.0.x
            runtime: -x64
            codecov: false

    runs-on: ${{ matrix.options.os }}
    env:
      # JxlNet 0.12.0.5 pins this native source revision. Its packaged libraries use skcms.
      JXL_REFERENCE_REVISION: 38ca29b72892bc7ce74fc01de47626205870063a

    steps:
      - name: Install libgdi+, which is required for tests running on ubuntu
        if: ${{ contains(matrix.options.os, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get -y install libgdiplus libgif-dev libglib2.0-dev libcairo2-dev libtiff-dev libexif-dev

      - name: Install native test libraries on macOS
        if: ${{ contains(matrix.options.os, 'macos-26') }}
        run: |
          brew update
          brew install mono-libgdiplus
          # Create symlinks to make libgdiplus discoverable
          sudo mkdir -p /usr/local/lib
          sudo ln -sf $(brew --prefix)/lib/libgdiplus.dylib /usr/local/lib/libgdiplus.dylib
          # Verify installation
          ls -la $(brew --prefix)/lib/libgdiplus* || echo "libgdiplus not found in brew prefix"
          ls -la /usr/local/lib/libgdiplus* || echo "libgdiplus not found in /usr/local/lib"

      - name: Git Config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      # Use the warmed key from WarmLFS. Do not recompute or recreate .lfs-assets-id here.
      - name: Git Setup LFS Cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ needs.WarmLFS.outputs.lfs_key }}

      - name: Git Pull LFS
        shell: bash
        run: git lfs pull

      - name: Cache macOS JPEG XL reference
        if: ${{ contains(matrix.options.os, 'macos-26') }}
        id: jxl-native-cache
        uses: actions/cache@v6
        with:
          path: artifacts/native/jxlnet
          key: ${{ runner.os }}-${{ runner.arch }}-jxlnet-${{ env.JXL_REFERENCE_REVISION }}-skcms-v1

      - name: Build macOS JPEG XL reference
        if: ${{ contains(matrix.options.os, 'macos-26') && steps.jxl-native-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          # JxlNet has no macOS binaries. Build its pinned source with the same CMS instead of Homebrew's Little CMS build.
          reference_source="$GITHUB_WORKSPACE/artifacts/native/jxlnet-source"
          reference_prefix="$GITHUB_WORKSPACE/artifacts/native/jxlnet"
          git init "$reference_source"
          git -C "$reference_source" remote add origin https://github.com/Guerra24/libjxl.git
          git -C "$reference_source" fetch --depth 1 origin "$JXL_REFERENCE_REVISION"
          git -C "$reference_source" checkout --detach FETCH_HEAD
          git -C "$reference_source" submodule update --init --depth 1 third_party/brotli third_party/highway third_party/skcms
          cmake -S "$reference_source" -B "$reference_source/build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$reference_prefix" \
            -DCMAKE_INSTALL_RPATH='@loader_path' -DBUILD_SHARED_LIBS=ON -DJPEGXL_STATIC=OFF \
            -DJPEGXL_ENABLE_SKCMS=ON -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_TOOLS=OFF -DJPEGXL_ENABLE_DEVTOOLS=OFF \
            -DJPEGXL_ENABLE_EXAMPLES=OFF -DJPEGXL_ENABLE_BENCHMARK=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_OPENEXR=OFF -DJPEGXL_ENABLE_SJPEG=OFF \
            -DJPEGXL_ENABLE_PLUGINS=OFF -DJPEGXL_ENABLE_VIEWERS=OFF \
            -DJPEGXL_ENABLE_TCMALLOC=OFF -DJPEGXL_ENABLE_JNI=OFF
          cmake --build "$reference_source/build" --config Release --parallel "$(sysctl -n hw.ncpu)"
          cmake --install "$reference_source/build" --config Release

      - name: Use macOS JPEG XL reference
        if: ${{ contains(matrix.options.os, 'macos-26') }}
        shell: bash
        run: |
          # Load this build's decoder, encoder, CMS and Brotli libraries together, including in child processes.
          reference_lib="$GITHUB_WORKSPACE/artifacts/native/jxlnet/lib"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$reference_lib:${DYLD_FALLBACK_LIBRARY_PATH:-/usr/local/lib:/usr/lib}" >> "$GITHUB_ENV"
          otool -L "$reference_lib/libjxl.dylib"
          otool -L "$reference_lib/libjxl_cms.dylib"

      - name: NuGet Install
        uses: NuGet/setup-nuget@v4

      - name: NuGet Setup Cache
        uses: actions/cache@v6
        id: nuget-cache
        with:
          path: ~/.nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: DotNet Setup
        if: ${{ matrix.options.sdk-preview != true }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: DotNet Setup Preview
        if: ${{ matrix.options.sdk-preview == true }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-quality: preview
          dotnet-version: |
            11.0.x

      - name: DotNet Build
        if: ${{ matrix.options.sdk-preview != true }}
        shell: pwsh
        run: ./ci-build.ps1 "${{matrix.options.framework}}"
        env:
          SIXLABORS_TESTING: True

      - name: DotNet Build Preview
        if: ${{ matrix.options.sdk-preview == true }}
        shell: pwsh
        run: ./ci-build.ps1 "${{matrix.options.framework}}"
        env:
          SIXLABORS_TESTING_PREVIEW: True

      - name: DotNet Test
        if: ${{ matrix.options.sdk-preview != true }}
        shell: pwsh
        run: ./ci-test.ps1 "${{matrix.options.os}}" "${{matrix.options.framework}}" "${{matrix.options.runtime}}" "${{matrix.options.codecov}}"
        env:
          SIXLABORS_TESTING: True
          XUNIT_PATH: .\tests\ImageSharp.Tests # Required for xunit
          # Capture child-process crashes before VSTest can record a stack trace. Mini dumps omit the managed heap.
          DOTNET_DbgEnableMiniDump: '1'
          DOTNET_DbgMiniDumpType: '1'
          DOTNET_DbgMiniDumpName: ${{ runner.temp }}/imagesharp-%e-%p.dmp
          DOTNET_EnableCrashReport: '1'

      - name: DotNet Test Preview
        if: ${{ matrix.options.sdk-preview == true }}
        shell: pwsh
        run: ./ci-test.ps1 "${{matrix.options.os}}" "${{matrix.options.framework}}" "${{matrix.options.runtime}}" "${{matrix.options.codecov}}"
        env:
          SIXLABORS_TESTING_PREVIEW: True
          XUNIT_PATH: .\tests\ImageSharp.Tests # Required for xunit
          # Capture child-process crashes before VSTest can record a stack trace. Mini dumps omit the managed heap.
          DOTNET_DbgEnableMiniDump: '1'
          DOTNET_DbgMiniDumpType: '1'
          DOTNET_DbgMiniDumpName: ${{ runner.temp }}/imagesharp-%e-%p.dmp
          DOTNET_EnableCrashReport: '1'

      - name: Export Failed Output
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: actual_output_${{ runner.os }}_${{ runner.arch }}_${{ matrix.options.framework }}${{ matrix.options.runtime }}.zip
          # ActualOutput holds the images that the tests write and the test runner log from ci-test.ps1.
          # TestResults is the default results folder of dotnet test. When the test process crashes, --blame
          # writes a sequence file there that lists the tests that ran before the crash.
          # Runtime dumps and crash reports record the failing native and managed frames of child processes.
          path: |
            tests/Images/ActualOutput/
            tests/ImageSharp.Tests/TestResults/
            ${{ runner.temp }}/imagesharp-*

  Publish:
    needs: [Build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push')
    steps:
      - name: Git Config
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: NuGet Install
        uses: NuGet/setup-nuget@v4

      - name: NuGet Setup Cache
        uses: actions/cache@v6
        id: nuget-cache
        with:
          path: ~/.nuget
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: DotNet Pack
        shell: pwsh
        run: ./ci-pack.ps1

      - name: Feedz Publish
        shell: pwsh
        run: |
          dotnet nuget push .\artifacts\*.nupkg -k ${{secrets.FEEDZ_TOKEN}} -s https://f.feedz.io/sixlabors/sixlabors/nuget/index.json --skip-duplicate
          dotnet nuget push .\artifacts\*.snupkg -k ${{secrets.FEEDZ_TOKEN}} -s https://f.feedz.io/sixlabors/sixlabors/symbols --skip-duplicate

      - name: NuGet Publish
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          dotnet nuget push .\artifacts\*.nupkg -k ${{secrets.NUGET_TOKEN}} -s https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push .\artifacts\*.snupkg -k ${{secrets.NUGET_TOKEN}} -s https://api.nuget.org/v3/index.json --skip-duplicate
